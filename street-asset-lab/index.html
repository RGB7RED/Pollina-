<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a3037">
<title>MINI CITY — Отдельная лаборатория объекта</title>
<link rel="stylesheet" href="../object-viewer/free-flight.css">
<style>
:root{color-scheme:dark;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#899ba1;color:#e5f0ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:max(9px,env(safe-area-inset-top));left:max(9px,env(safe-area-inset-left));right:max(9px,env(safe-area-inset-right));display:flex;gap:7px;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.card{background:#1c333ce8;color:#e9f3ec;border:1px solid #c8dcd088;border-radius:12px;padding:11px 13px;backdrop-filter:blur(12px);pointer-events:auto}
.info{max-width:55vw}.metrics{max-width:44vw;font-size:11px;line-height:1.7}
small{font-size:9px;color:#a8d5c4;letter-spacing:.1em;font-weight:850}
h1{font-size:17px;line-height:1.2;margin:6px 0 7px}
p{font-size:11px;color:#cadfd2;line-height:1.4;margin:6px 0}
nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
nav a{display:inline-flex;align-items:center;min-height:38px;padding:6px 8px;font-size:10px;color:#e6f1e9;border:1px solid #b4d4c98c;border-radius:9px;text-decoration:none}
.controls{position:fixed;bottom:max(61px,calc(env(safe-area-inset-bottom) + 55px));left:8px;right:8px;z-index:7;display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
button{min-height:44px;background:#203c45e6;color:#e9f3e9;border:1px solid #bad7c799;border-radius:10px;font-weight:750;padding:8px 12px}
button.active{background:#d6ebdd;color:#1c3d38}
#fail{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;background:#49272be9;padding:16px;border-radius:12px;max-width:90vw}
#fail[hidden],.collapsed .detail{display:none!important}
@media(max-width:650px){.hud{left:6px;right:6px;gap:5px}.card{padding:8px}.info{max-width:54vw}.metrics{max-width:45vw;font-size:9px}h1{font-size:14px}p{font-size:9px}nav a{font-size:9px;padding:4px 6px}.controls{gap:4px}.controls button{font-size:10px;padding:7px 9px}}
@media(orientation:landscape) and (max-height:490px){.controls{bottom:max(46px,calc(env(safe-area-inset-bottom) + 42px))}.card{padding:6px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<main id="stage" aria-label="Изолированный 3D-просмотр одного объекта"></main>
<div class="hud">
 <section class="card info">
  <small>MINI CITY · КАТАЛОГ / 3D</small>
  <h1 id="title">Загрузка объекта…</h1>
  <p id="description">Только одна модель, без карты города.</p>
  <nav><a id="back" href="../studio/catalog.html">← В каталог</a><a href="../studio/index.html">⚙ Студия</a></nav>
 </section>
 <section class="card metrics" id="telemetry">
  <button id="collapse" type="button" aria-expanded="true">▾ Характеристики</button>
  <div class="detail" id="fps">FPS: —</div>
  <div class="detail" id="calls">Вызовы: —</div>
  <div class="detail" id="tris">Треугольники: —</div>
  <div class="detail" id="materials">Материалы: —</div>
  <div class="detail" id="size">Габариты: —</div>
  <div class="detail" id="scene-status">В каталоге: установлен в городе</div>
 </section>
</div>
<div class="controls" aria-label="Ракурсы инспектора">
 <button data-view="threequarter" class="active" type="button">¾</button>
 <button data-view="front" type="button">Спереди</button>
 <button data-view="side" type="button">Сбоку</button>
 <button data-view="top" type="button">Сверху</button>
 <button id="reset" type="button">↻ Сброс</button>
</div>
<div id="fail" role="alert" hidden></div>
<script type="module" src="./lab.js"></script>
</body>
</html>
