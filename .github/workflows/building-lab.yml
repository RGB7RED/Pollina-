name: MINI CITY Labs and Developer Studio
on:
  push:
    branches:
      - feat/mini-city-v033-stage3-building-blockout
      - feat/mini-city-v033-stage311-freecam
      - feat/mini-city-v033-stage312-camera-fix
      - feat/mini-city-v033-stage32-facade
      - feat/mini-city-v033-stage33-materials-light
      - feat/mini-city-v033-stage34-asset-export-lab-switch
      - feat/mini-city-v033-stage41-playable-dual-camera
      - feat/mini-city-v033-stage421-first-street
      - feat/mini-city-v033-stage422-developer-studio
    paths:
      - 'building-lab/**'
      - 'character-lab/**'
      - 'lab/**'
      - 'play-lab/**'
      - 'studio/**'
      - '.github/workflows/building-lab.yml'
  workflow_dispatch:
jobs:
  building-shape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse architectural JS modules
        run: |
          node --check building-lab/building.js
          node --check building-lab/lab.js
          node --check building-lab/free-camera.js
          node --check building-lab/materials.js
          node --check building-lab/export-glb.js
          node --check play-lab/game.js
          node --check play-lab/controller.js
          node --check play-lab/animation.js
          node --check play-lab/street.js
          node --check play-lab/studio.js
      - name: Test stage 4.1 first/third-person movement and house collisions
        run: node play-lab/test-controller.mjs
      - name: Check stage 4.1.1 model orientation and non-reversed swipe
        run: node play-lab/test-directions.mjs
      - name: Check stage 4.1 actual animation clip wiring
        run: node play-lab/test-animation.mjs
      - name: Test stage 4.2.1 street layout, instancing and collision
        run: node play-lab/test-street.mjs
      - name: Test same-scene Developer Studio and collision overlay
        run: node play-lab/test-studio.mjs
      - name: Test Developer Studio navigation
        run: node studio/test-navigation.mjs
      - name: Check stage 4.1 mobile gameplay UI
        run: node play-lab/test-viewer.mjs
      - name: Check real wall openings, balcony variants and entrances
        run: node building-lab/test-building.mjs
      - name: Check authored textures, roof UVs and world-aligned brick shader
        run: node building-lab/test-materials.mjs
      - name: Test GLB export structural and UV baking contract
        run: node building-lab/test-export.mjs
      - name: Test two-way house and character lab navigation
        run: node lab/test-switch.mjs
      - name: Check character lab UI selector
        run: node character-lab/test-ui.mjs
      - name: Test XYZ free camera and joystick math
        run: node building-lab/test-free-camera.mjs
      - name: Check browser controls and mobile UI wiring
        run: node building-lab/test-viewer.mjs
