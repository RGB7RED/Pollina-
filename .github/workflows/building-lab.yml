name: MINI CITY Labs and Developer Studio
on:
  push:
    branches:
      - feat/mini-city-v033-stage3-building-blockout
      - feat/mini-city-v033-stage311-freecam
      - feat/mini-city-v033-stage312-camera-fix
      - feat/mini-city-v033-stage32-facade
      - feat/mini-city-v033-stage33-materials-light
      - feat/mini-city-v033-stage34-asset-export-lab-switch
      - feat/mini-city-v033-stage41-playable-dual-camera
      - feat/mini-city-v033-stage421-first-street
      - feat/mini-city-v033-stage422-developer-studio
      - feat/mini-city-v033-stage423-asset-catalog
      - feat/mini-city-v033-stage424-catalog-folders
      - feat/mini-city-v033-stage425-catalog-as-object-hub
      - feat/mini-city-v033-stage431-bus-stop-lab
      - feat/mini-city-v033-stage432-isolated-asset-viewers
      - feat/mini-city-v033-stage433-bench-lamp-references
      - feat/mini-city-v033-stage434-independent-street-grass
      - feat/mini-city-v033-stage435-isolated-street-detailed-grass
      - feat/mini-city-v033-stage437-fine-lighter-grass
      - feat/mini-city-v033-stage44-five-tree-variants
      - fix/mini-city-v033-stage441-hidden-tree-branches
      - feat/mini-city-v033-stage451-seamless-entry-door
      - feat/mini-city-v033-stage452-first-floor-foyer
      - feat/mini-city-v033-stage453-real-stairs-glazed-door
      - feat/mini-city-v033-stage454-five-floors-apartment-doors
      - fix/mini-city-v033-stage4541-integrated-landings-free-camera
      - fix/mini-city-v033-stage4542-deeper-return-door-reversal-railings
      - fix/mini-city-v033-stage4543-facade-windows-clear-void
    paths:
      - 'building-lab/**'
      - 'bus-stop-lab/**'
      - 'street-asset-lab/**'
      - 'street-lab/**'
      - 'grass-lab/**'
      - 'object-viewer/**'
      - 'character-lab/**'
      - 'lab/**'
      - 'play-lab/**'
      - 'studio/**'
      - 'models/**'
      - '.github/workflows/building-lab.yml'
  workflow_dispatch:
jobs:
  building-shape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse architectural JS modules
        run: |
          node --check building-lab/building.js
          node --check building-lab/lab.js
          node --check building-lab/free-camera.js
          node --check building-lab/materials.js
          node --check building-lab/export-glb.js
          node --check play-lab/game.js
          node --check play-lab/controller.js
          node --check play-lab/entrance.js
          node --check play-lab/free-camera.js
          node --check play-lab/animation.js
          node --check play-lab/street.js
          node --check play-lab/grass.js
          node --check play-lab/tree-models.js
          node --check grass-lab/lab.js
          node --check play-lab/studio.js
          node --check models/catalog-utils.js
          node --check studio/catalog.js
          node --check bus-stop-lab/bus-stop.js
          node --check bus-stop-lab/materials.js
          node --check bus-stop-lab/lab.js
          node --check street-asset-lab/asset.js
          node --check street-asset-lab/lab.js
          node --check street-lab/lab.js
          node --check object-viewer/free-flight.js
      - name: Test stop geometry groups, glazing and mobile budget
        run: node bus-stop-lab/test-bus-stop.mjs
      - name: Test bus-stop camera viewer and navigation
        run: node bus-stop-lab/test-viewer.mjs
      - name: Test standalone house/street viewers and grass geometry
        run: |
          node street-lab/test-street-lab.mjs
          node grass-lab/test-grass.mjs
      - name: Test isolated tree lamp bench and free-flight controls
        run: |
          node street-asset-lab/test-isolation.mjs
          node street-asset-lab/test-viewer.mjs
          node object-viewer/test-free-flight.mjs
      - name: Test stage 4.5.1 physical first entrance, swinging door and continuous movement
        run: node play-lab/test-entrance.mjs
      - name: Test stage 4.5.2 two swing doors, mailboxes, ground-floor landing and continuous movement
        run: node play-lab/test-foyer.mjs
      - name: Test stage 4.5.3 physical U stairs and transparent second-door window
        run: node play-lab/test-stairs.mjs
      - name: Test 4.5.4.2 deeper return landings, opposite rear doors and continuous guarded handrails
        run: node play-lab/test-five-floors.mjs
      - name: Test stage 4.5.4.3 facade windows, real openings and upper landing headroom
        run: node play-lab/test-architecture-4543.mjs
      - name: Test 4.5.4.1: 20 apartment doors ON stair landings, no avatar in scene lab, 6DoF camera
        run: node play-lab/test-free-camera.mjs
      - name: Test stage 4.1 first/third-person movement and house collisions
        run: node play-lab/test-controller.mjs
      - name: Check stage 4.1.1 model orientation and non-reversed swipe
        run: node play-lab/test-directions.mjs
      - name: Check stage 4.1 actual animation clip wiring
        run: node play-lab/test-animation.mjs
      - name: Test five real tree variants and mobile draw budgets
        run: node street-asset-lab/test-five-trees.mjs
      - name: Test stage 4.2.1 street layout, instancing and collision
        run: node play-lab/test-street.mjs
      - name: Test same-scene Developer Studio and collision overlay
        run: node play-lab/test-studio.mjs
      - name: Validate real object catalog and source paths
        run: node models/test-catalog.mjs
      - name: Test search UI and catalog links
        run: node studio/test-catalog.mjs
      - name: Test asset catalog DOM, filters and error recovery
        run: node studio/test-catalog-render.mjs
      - name: Test Developer Studio navigation
        run: node studio/test-navigation.mjs
      - name: Check stage 4.1 mobile gameplay UI
        run: node play-lab/test-viewer.mjs
      - name: Check real wall openings, balcony variants and entrances
        run: node building-lab/test-building.mjs
      - name: Check authored textures, roof UVs and world-aligned brick shader
        run: node building-lab/test-materials.mjs
      - name: Test GLB export structural and UV baking contract
        run: node building-lab/test-export.mjs
      - name: Test two-way house and character lab navigation
        run: node lab/test-switch.mjs
      - name: Check character lab UI selector
        run: node character-lab/test-ui.mjs
      - name: Test XYZ free camera and joystick math
        run: node building-lab/test-free-camera.mjs
      - name: Check browser controls and mobile UI wiring
        run: node building-lab/test-viewer.mjs
