name: MINI CITY 5.0 — Furnished apartments and catalog
on:
  push:
    branches:
      - feat/mini-city-stage50-first-floor-furnishing
  workflow_dispatch:
jobs:
  furnishing-and-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax and catalog schema
        run: |
          node --check models/interior-assets.js
          node --check play-lab/furniture.js
          node --check play-lab/game.js
          node --check interior-asset-lab/lab.js
          node models/test-catalog.mjs
          node studio/test-catalog-render.mjs
      - name: Check all furnished first-floor rooms
        run: node play-lab/test-furniture-50.mjs
      - name: Check original house and stair route
        run: |
          node building-lab/test-building.mjs
          node play-lab/test-architecture-478.mjs
          node play-lab/test-five-floors.mjs
          node play-lab/test-apartment.mjs
