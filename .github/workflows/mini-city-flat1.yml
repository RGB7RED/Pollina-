name: MINI CITY — Flat 1 replan acceptance
on:
  push:
    branches:
      - feat/mini-city-flat1-layout-20261027
  workflow_dispatch:
jobs:
  architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check play-lab/first-floor.js
          node --check play-lab/furniture.js
          node --check play-lab/game.js
          node --check play-lab/test-flat1-replan.mjs
      - name: Flat 1 layout, furniture and windows
        run: |
          node play-lab/test-flat1-replan.mjs
          node play-lab/test-furniture-50.mjs
      - name: Existing house, apartments and staircase regression
        run: |
          node models/test-catalog.mjs
          node play-lab/test-architecture-478.mjs
          node play-lab/test-five-floors.mjs
          node play-lab/test-apartment.mjs
